# Zwei Behauptungen dieser Site veralten von allein, und beide gegenüber
# fremden Sites:
#
#   check:demo   Der Demo-Prompt auf der Startseite ist eine Kopie — diese Site
#                hat keinen Build-Schritt, der ihn holen könnte.
#   check:sites  Jeder Galerie-Eintrag behauptet, dass dort ein Button steht.
#
# Beides prüft ein wöchentlicher Lauf. Nicht in test.yml, weil er ins Netz
# greift: ein Ausfall dort darf keinen fremden Pull Request rot machen.
name: Buttons in freier Wildbahn

on:
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check:demo
      - run: npm run check:sites
        if: always()
