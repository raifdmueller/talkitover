# Baut die Hub-Site aus docs/ und veröffentlicht sie auf GitHub Pages.
# Voraussetzung: Settings -> Pages -> Source = "GitHub Actions".
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Ein Deployment zur Zeit, und laufende nicht abbrechen.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      # Zwei Durchläufe, weil Jekyll nichts einsetzen kann, was es noch nicht
      # gibt: Der erste erzeugt das HTML, das Script liest es und schreibt die
      # Textfassungen und den Prompt, der zweite rendert damit den Button.
      # So macht diese Site, was ihr Jekyll-Rezept vorschreibt (#21).
      # Der Messaufbau T6 muss vor dem ersten Durchlauf stehen: Die Seite hat
      # Front Matter und wird von Jekyll gerendert wie jede andere.
      - run: npm run build:t6
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site
      - run: npm run build:talkitover
      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
